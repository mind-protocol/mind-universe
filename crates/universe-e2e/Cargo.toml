[package]
name = "universe-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
universe-assets = { path = "../universe-assets" }
universe-capabilities = { path = "../universe-capabilities" }
universe-compiler = { path = "../universe-compiler" }
universe-core = { path = "../universe-core" }
universe-embeddings = { path = "../universe-embeddings" }
universe-fields = { path = "../universe-fields" }
universe-ir = { path = "../universe-ir" }
universe-physics = { path = "../universe-physics" }
universe-protocol = { path = "../universe-protocol" }
universe-query = { path = "../universe-query" }
universe-store = { path = "../universe-store" }
universe-supervisor = { path = "../universe-supervisor" }
universe-testkit = { path = "../universe-testkit" }
universe-transactions = { path = "../universe-transactions" }
universe-vm = { path = "../universe-vm" }

[dev-dependencies]
tempfile = "3"

# Explicit registration for the L1 Attention injector. The sibling injectors in
# src/bin/ are picked up by Cargo autodiscovery; this entry is additive (same
# name + path, so it merges with the auto-discovered target rather than
# duplicating it) and documents the injector alongside the fixture it loads.
[[bin]]
name = "inject_attention"
path = "src/bin/inject_attention.rs"
